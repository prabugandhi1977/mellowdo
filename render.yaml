# Render Blueprint: one Docker web service with a persistent disk for the SQLite database.
# Persistent disks need a paid plan; the free plan would lose everyone's data on every restart.
services:
  - type: web
    name: mellowdo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: mellowdo-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      # Sign-in codes are emailed through Resend (https://resend.com). Paste these in the Render dashboard.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false   # e.g. MellowDo <login@yourdomain.com>, on a domain verified in Resend
